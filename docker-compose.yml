name: controla-ai

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: ${IMAGE_NAME:-controla-ai/api}:${IMAGE_TAG:-latest}
  env_file: [.env]
  volumes:
    - ./docker/secrets:/run/secrets:ro
    - receipts-data:/var/lib/controlaai/receipts
    - exports-data:/var/lib/controlaai/exports
  depends_on:
    postgres: { condition: service_healthy }
    redis:    { condition: service_healthy }
  networks: [controla-ai-net]
  restart: unless-stopped

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: controla-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [controla-ai-net]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: controla-ai-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [controla-ai-net]
    restart: unless-stopped

  api:
    <<: *app-common
    container_name: controla-ai-api
    ports:
      - "${APP_PORT:-8000}:8000"

  worker:
    <<: *app-common
    container_name: controla-ai-worker
    command: arq app.infra.queue.worker.WorkerSettings
    healthcheck:
      test: ["NONE"]

  scheduler:
    <<: *app-common
    container_name: controla-ai-scheduler
    command: arq app.infra.queue.scheduler.SchedulerSettings
    healthcheck:
      test: ["NONE"]

volumes:
  postgres-data:
  redis-data:
  receipts-data:
  exports-data:

networks:
  controla-ai-net:
    driver: bridge
